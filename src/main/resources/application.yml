server:
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: securepay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/securepay}
    username: ${DATABASE_USER:securepay}
    password: ${DATABASE_PASSWORD:securepay_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
securepay:
  encryption-key: ${SECUREPAY_ENCRYPTION_KEY:}
  fraud-threshold: ${FRAUD_THRESHOLD:2500.00}
