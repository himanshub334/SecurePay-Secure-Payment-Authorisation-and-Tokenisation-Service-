services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securepay
      POSTGRES_USER: securepay
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-replace-this-db-password}
    ports: ["5432:5432"]
    volumes: ["securepay-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securepay -d securepay"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  securepay-db:
